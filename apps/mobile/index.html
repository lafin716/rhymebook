<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#eef7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101f29" media="(prefers-color-scheme: dark)" />
    <title>octobooks — 나만의 가지치기 학습</title>
    <meta name="description" content="호기심이 뻗는 만큼, 나의 배움도 깊어져요. octobooks에서 질문을 가지로 이어 나만의 학습 지도를 만드세요." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 첫 페인트 전에 테마 클래스 적용 (깜빡임 방지)
      (function () {
        var pref = 'system';
        var palette = 'ocean';
        try {
          pref = localStorage.getItem('branch.theme') || 'system';
          palette = localStorage.getItem('octobooks.palette') || 'ocean';
        } catch (e) {}
        document.documentElement.dataset.palette = ['ocean', 'lagoon', 'coral', 'abyss', 'pearl'].indexOf(palette) >= 0 ? palette : 'ocean';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
