# 데스크톱 설치 파일 빌드 + Android 디버그 APK → GitHub Release (ADR-022)
# 서명은 저장소 secrets가 있을 때만 적용된다. 없으면 서명 없이 빌드한다 (BLOCKERS B-10).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 서명 설정 (secrets가 있을 때만)
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -n "$MAC_CSC_LINK" ]] || [[ "$RUNNER_OS" == "Windows" && -n "$WIN_CSC_LINK" ]]; then
            echo "서명 인증서 사용"
          else
            echo "서명 secrets 없음 → 서명 없이 빌드"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
      - name: 패키징
        run: pnpm --filter @branch/desktop package
        env:
          # macOS 서명·공증 (Developer ID .p12 base64, Apple ID 앱 암호)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # 서명 secrets(ANDROID_KEYSTORE_BASE64·ANDROID_KEYSTORE_PASSWORD)가 있으면 서명된 release APK/AAB, 없으면 debug APK
      - name: Android 빌드
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RHYMEBOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$RHYMEBOOK_KEYSTORE_PASSWORD" ]]; then
            export RHYMEBOOK_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RHYMEBOOK_KEYSTORE"
            pnpm --filter @branch/mobile build:android:release
            cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/rhymebook-android.apk
            cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab out/rhymebook-android.aab
            rm -f "$RHYMEBOOK_KEYSTORE"
          else
            echo "Android 서명 secrets 없음 → debug APK"
            pnpm --filter @branch/mobile build:android
            cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk out/rhymebook-android-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
